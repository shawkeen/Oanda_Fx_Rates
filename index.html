<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX Rate Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#181b24;--card2:#1e2230;--accent:#6c63ff;--accent2:#00c9a7;--text:#e8e8ee;--text2:#9a9ab0;--border:#2a2d3a;--danger:#ff6b6b}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-top:48px}
.tkr{position:fixed;top:0;left:0;right:0;height:48px;z-index:1000;background:linear-gradient(90deg,#12141f,#1a1d2e,#12141f);border-bottom:1px solid var(--border);overflow:hidden;display:flex;align-items:center}
.tkr-badge{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 16px;font-size:.72rem;font-weight:600;color:var(--text2);border-right:1px solid var(--border);height:100%;background:rgba(0,0,0,.25);letter-spacing:.5px;text-transform:uppercase;z-index:2}
.tkr-badge .dot{width:8px;height:8px;border-radius:50%;background:#ff4757;animation:pulse 1.2s ease infinite;display:none}
.tkr-badge.live .dot{display:block}.tkr-badge.live .lbl{color:#ff4757}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,.5)}50%{box-shadow:0 0 0 6px rgba(255,71,87,0)}}
.tkr-track{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.tkr-content{display:flex;white-space:nowrap;will-change:transform;animation:scroll 120s linear infinite}
.tkr-track:hover .tkr-content{animation-play-state:paused}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.tkr-ph{color:var(--text2);font-size:.82rem;padding:0 20px}
.tkr-item{display:inline-flex;align-items:center;gap:8px;padding:0 22px;font-size:.84rem;font-weight:500;height:48px;border-right:1px solid rgba(255,255,255,.04)}
.tkr-item .tp{color:var(--text2);font-weight:400}.tkr-item .tr{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.tkr-ctrl{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 14px;border-left:1px solid var(--border);height:100%;background:rgba(0,0,0,.25);z-index:2}
.tkr-ctrl .sl{font-size:.6rem;color:var(--text2);text-transform:uppercase}.tkr-ctrl input[type=range]{width:70px;accent-color:var(--accent)}
.hdr{background:linear-gradient(135deg,#1a1d2e,#0f1117);padding:38px 20px 28px;text-align:center;border-bottom:1px solid var(--border)}
.hdr h1{font-size:2.3rem;font-weight:700;background:linear-gradient(135deg,#6c63ff,#00c9a7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{color:var(--text2);margin-top:8px;font-size:.93rem}
.badge{display:inline-block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;border-radius:6px;padding:2px 10px;font-size:.85rem}
.ctr{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
.sec{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-t{font-size:.95rem;font-weight:700}.sec-sub{color:var(--text2);font-size:.78rem}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:700;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text2)}
.row{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:14px}.col{flex:1;min-width:230px}
.col label{display:block;font-weight:500;margin-bottom:7px;font-size:.88rem;color:var(--text2)}
input[type=date],select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-family:inherit;font-size:.9rem;outline:none}
input:focus,select:focus{border-color:var(--accent)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
.btn{padding:11px 15px;border:none;border-radius:11px;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .25s;display:inline-flex;align-items:center;gap:9px}
.bp{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}.bp:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(108,99,255,.3)}
.bs{background:var(--card2);color:var(--text);border:1px solid var(--border)}.bs:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.spin{width:17px;height:17px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;display:none}
.btn.ld .spin{display:inline-block}.btn.ld .bt{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ms-w{position:relative}
.ms-trig{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.92rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.ms-trig:hover,.ms-trig.open{border-color:var(--accent)}.ms-trig .arr{font-size:.7rem}.ms-trig.open .arr{transform:rotate(180deg)}
.ms-dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;z-index:100;max-height:320px;display:none;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.ms-dd.show{display:flex}
.ms-sr{padding:9px 12px;border-bottom:1px solid var(--border)}
.ms-sr input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:.86rem;outline:none}
.ms-sr input::placeholder{color:var(--text2)}.ms-sr input:focus{border-color:var(--accent)}
.ms-ac{display:flex;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border)}
.ms-ac button{flex:1;padding:5px 0;border-radius:6px;border:none;font-size:.76rem;font-weight:500;cursor:pointer}
.bsa{background:var(--accent);color:#fff}.bds{background:var(--card2);color:var(--text2)}
.ms-ls{overflow-y:auto;flex:1;padding:4px 0}
.ms-i{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;font-size:.86rem}
.ms-i:hover{background:var(--card2)}.ms-i.hid{display:none}
.ms-i input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.ms-i .cc{font-weight:600;color:var(--accent2);min-width:36px}.ms-i .cn{color:var(--text2);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:var(--text2);font-size:.8rem;font-weight:500;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:linear-gradient(135deg,rgba(108,99,255,.18),rgba(0,201,167,.12));border-color:var(--accent);color:#fff}
textarea{width:100%;min-height:130px;resize:vertical;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-family:ui-monospace,Consolas,monospace;font-size:.88rem;outline:none}
textarea:focus{border-color:var(--accent)}
.pa{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stats{display:flex;gap:14px;margin:16px 0;flex-wrap:wrap}
.st{flex:1;min-width:140px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:center}
.st .sv{font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.st .sl{font-size:.76rem;color:var(--text2);margin-top:4px}
.tw{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:14px}
.ttb{display:flex;justify-content:flex-end;gap:9px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tbt{padding:7px 13px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
.tbt:hover{border-color:var(--accent);background:rgba(108,99,255,.08)}
table.rt{width:100%;border-collapse:collapse}
.rt th{background:var(--card2);color:var(--text2);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;text-align:left;white-space:nowrap}
.rt td{padding:11px 14px;border-top:1px solid var(--border);font-size:.88rem}
.rt tbody tr:hover{background:rgba(108,99,255,.04)}
.tc{font-weight:700;color:var(--accent2)}.tv{font-weight:700;font-variant-numeric:tabular-nums}.tb{color:var(--danger);font-weight:700}
.toast-c{position:fixed;top:58px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:9px}
.toast{padding:12px 18px;border-radius:10px;font-size:.86rem;font-weight:600;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:sli .3s ease;display:flex;align-items:center;gap:9px}
.toast.ok{background:linear-gradient(135deg,#00c9a7,#00b894)}.toast.er{background:linear-gradient(135deg,#ff6b6b,#ee5a24)}.toast.in{background:linear-gradient(135deg,#6c63ff,#5a52e0)}
@keyframes sli{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
